<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="349" viewBox="0 0 1080 349" role="img" font-family="Arial, Helvetica, sans-serif">
<title>How point evidence is assigned</title>
<desc>S01 has a uniquely contained point. P04 lies inside S08 but is used as nearest-neighbour evidence for S09, triggering a cross-building ownership warning. The point is four metres from the S09 footprint. The flag indicates a geometric risk. S07 has no eligible point or usable grid evidence.</desc>
<rect x="0" y="0" width="1080" height="349" rx="0" fill="#fff" stroke="none"/>
<text x="32" y="44" fill="#172f43" font-size="34" font-weight="700" text-anchor="start">How point evidence is assigned</text>
<text x="33" y="73" fill="#435e70" font-size="17" font-weight="400" text-anchor="start">SYNTHETIC DEMONSTRATION · Fictional footprint polygons and attribute points</text>
<rect x="33" y="107" width="316" height="136" rx="7" fill="#f1f6f8" stroke="#c7d6df"/>
<text x="47" y="136" fill="#172f43" font-size="22" font-weight="700" text-anchor="start">Containment</text>
<polygon points="121.00,158.00 261.00,158.00 261.00,199.00 121.00,199.00" fill="#fff" stroke="#087b77" stroke-width="1.5"/>
<text x="191.0" y="221" fill="#087b77" font-size="15" font-weight="700" text-anchor="middle">S01</text>
<circle cx="156.0" cy="178" r="5" fill="#087b77" stroke="none" stroke-width="2"/>
<text x="156.0" y="153" fill="#435e70" font-size="13" font-weight="400" text-anchor="middle">P01</text>
<text x="47" y="271" fill="#435e70" font-size="15" font-weight="400" text-anchor="start">One uniquely contained point</text>
<rect x="382" y="107" width="316" height="136" rx="7" fill="#f1f6f8" stroke="#c7d6df"/>
<text x="396" y="132" fill="#172f43" font-size="20" font-weight="700" text-anchor="start" aria-label="Nearest-neighbour fallback with ownership conflict">Nearest-neighbour fallback<tspan x="396" dy="22"> with ownership conflict</tspan></text>
<polygon points="412,173 612,173 612,223 412,223" fill="#fff" stroke="#087b77" stroke-width="1.5"/>
<text x="512" y="239" fill="#087b77" font-size="15" font-weight="700" text-anchor="middle">S08</text>
<polygon points="622,173 662,173 662,223 622,223" fill="#fff" stroke="#a44e29" stroke-width="1.5"/>
<text x="642" y="239" fill="#a44e29" font-size="15" font-weight="700" text-anchor="middle">S09</text>
<circle cx="602" cy="198" r="5" fill="#a44e29" stroke="none" stroke-width="2"/>
<text x="595" y="188" fill="#435e70" font-size="13" font-weight="400" text-anchor="end">P04</text>
<line x1="608" y1="198" x2="622" y2="198" stroke="#a44e29" stroke-width="2" stroke-dasharray="3 3"/>
<polyline points="617,194 622,198 617,202" stroke="#a44e29" stroke-width="2" fill="none"/>
<text x="595" y="216" fill="#a44e29" font-size="13" font-weight="400" text-anchor="end">4 m to S09</text>
<text x="396" y="271" fill="#435e70" font-size="15" font-weight="400" text-anchor="start">P04 is inside S08. S09 flags the transfer.</text>
<rect x="731" y="107" width="316" height="136" rx="7" fill="#f1f6f8" stroke="#c7d6df"/>
<text x="745" y="136" fill="#172f43" font-size="22" font-weight="700" text-anchor="start">Unmatched</text>
<polygon points="819.00,158.00 959.00,158.00 959.00,199.00 819.00,199.00" fill="#fff" stroke="#087b77" stroke-width="1.5"/>
<text x="889.0" y="221" fill="#087b77" font-size="15" font-weight="700" text-anchor="middle">S07</text>
<text x="889" y="183" fill="#435e70" font-size="15" font-weight="400" text-anchor="middle">No eligible point</text>
<text x="745" y="271" fill="#435e70" font-size="15" font-weight="400" text-anchor="start">No eligible point or usable grid class</text>
<text x="33" y="330" fill="#435e70" font-size="15" font-weight="400" text-anchor="start">Synthetic illustration based on fictional data. Not a representation of actual Flensburg research results.</text>
