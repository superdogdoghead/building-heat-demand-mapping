<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="386" viewBox="0 0 1080 386" role="img" font-family="Arial, Helvetica, sans-serif">
<title>From spatial evidence to heat-demand estimates</title>
<desc>Six stages connect spatial evidence, point-to-footprint linkage, attribute reconstruction, deterministic heat-demand estimation, uncertainty propagation and evaluation.</desc>
<rect x="0" y="0" width="1080" height="386" rx="0" fill="#fff" stroke="none"/>
<text x="32" y="44" fill="#172f43" font-size="34" font-weight="700" text-anchor="start">From spatial evidence to heat-demand estimates</text>
<text x="33" y="73" fill="#435e70" font-size="17" font-weight="400" text-anchor="start">RESEARCH SCHEMATIC · Thesis workflow and synthetic verification</text>
<rect x="33" y="106" width="316" height="104" rx="7" fill="#f1f6f8" stroke="#c7d6df"/>
<text x="47" y="136" fill="#087b77" font-size="21" font-weight="700" text-anchor="start">Geospatial data inputs</text>
<text x="47" y="165" fill="#435e70" font-size="17" font-weight="400" text-anchor="start">Footprints and storey counts</text>
<text x="47" y="190" fill="#435e70" font-size="17" font-weight="400" text-anchor="start">Attribute points and census grid</text>
