<text x="396" y="136" fill="#087b77" font-size="21" font-weight="700" text-anchor="start">Point-to-footprint matching</text>
<text x="396" y="165" fill="#435e70" font-size="17" font-weight="400" text-anchor="start">Test containment and proximity</text>
<text x="396" y="190" fill="#435e70" font-size="17" font-weight="400" text-anchor="start">Record assignment provenance</text>
<line x1="703" y1="157" x2="725" y2="157" stroke="#087b77" stroke-width="2"/>
<polyline points="718.00,152.00 725.00,157.00 718.00,162.00" stroke="#087b77" stroke-width="2" fill="none"/>
<rect x="731" y="106" width="316" height="104" rx="7" fill="#f1f6f8" stroke="#c7d6df"/>
<text x="745" y="136" fill="#087b77" font-size="21" font-weight="700" text-anchor="start">Attribute reconstruction</text>
<text x="745" y="165" fill="#435e70" font-size="17" font-weight="400" text-anchor="start">Retain period–size candidate tuples</text>
<text x="745" y="190" fill="#435e70" font-size="17" font-weight="400" text-anchor="start">Apply the 1 km census fallback</text>
<rect x="731" y="239" width="316" height="104" rx="7" fill="#f1f6f8" stroke="#c7d6df"/>
<text x="745" y="269" fill="#087b77" font-size="21" font-weight="700" text-anchor="start">B0 / B1 heat estimation</text>
<text x="745" y="298" fill="#435e70" font-size="17" font-weight="400" text-anchor="start">Apply archetype heat intensities</text>
<text x="745" y="323" fill="#435e70" font-size="17" font-weight="400" text-anchor="start">Assess floor-area sensitivity</text>
<line x1="705" y1="290" x2="726" y2="290" stroke="#087b77" stroke-width="2"/>
<polyline points="712.00,285.00 705.00,290.00 712.00,295.00" stroke="#087b77" stroke-width="2" fill="none"/>
<rect x="382" y="239" width="316" height="104" rx="7" fill="#f1f6f8" stroke="#c7d6df"/>
<text x="396" y="269" fill="#087b77" font-size="21" font-weight="700" text-anchor="start">B2 uncertainty propagation</text>
<text x="396" y="298" fill="#435e70" font-size="17" font-weight="400" text-anchor="start">Propagate attribute alternatives</text>
<text x="396" y="323" fill="#435e70" font-size="17" font-weight="400" text-anchor="start">Compare sampling dependence</text>
<line x1="356" y1="290" x2="377" y2="290" stroke="#087b77" stroke-width="2"/>
<polyline points="363.00,285.00 356.00,290.00 363.00,295.00" stroke="#087b77" stroke-width="2" fill="none"/>
<rect x="33" y="239" width="316" height="104" rx="7" fill="#f1f6f8" stroke="#c7d6df"/>
<text x="47" y="269" fill="#087b77" font-size="21" font-weight="700" text-anchor="start">Evaluation and verification</text>
<text x="47" y="298" fill="#435e70" font-size="17" font-weight="400" text-anchor="start">Compare against external evidence</text>
<text x="47" y="323" fill="#435e70" font-size="17" font-weight="400" text-anchor="start">Verify the standalone demo</text>
