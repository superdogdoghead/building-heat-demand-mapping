<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="493" viewBox="0 0 1080 493" role="img" font-family="Arial, Helvetica, sans-serif">
<title>How spatial dependence changes uncertainty</title>
<desc>Empirical cumulative distributions for 2,000 draws per sampling setting, using seed 20261125. P05, P50 and P95 use inclusive linear interpolation of sorted draws. Grouped sampling has a wider central interval.</desc>
<rect x="0" y="0" width="1080" height="493" rx="0" fill="#fff" stroke="none"/>
<text x="32" y="44" fill="#172f43" font-size="34" font-weight="700" text-anchor="start">How spatial dependence changes uncertainty</text>
<text x="33" y="73" fill="#435e70" font-size="17" font-weight="400" text-anchor="start">SYNTHETIC DEMONSTRATION · Existing scenario · 2,000 draws per setting · Seed 20261125</text>
<line x1="108" y1="360" x2="741" y2="360" stroke="#c7d6df" stroke-width="1"/>
<text x="94" y="363" fill="#435e70" font-size="15" font-weight="400" text-anchor="end">0%</text>
